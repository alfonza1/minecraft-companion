name: Publish Player Two website
on:
  push:
    branches: [feat/minecraft-companion]
    paths: ['apps/website/**', 'packages/ui/**', 'scripts/build-website.mjs', 'package*.json', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: player-two-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:website
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/website/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static website
        id: deployment
        uses: actions/deploy-pages@v4
