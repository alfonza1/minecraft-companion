name: Verify release package
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run setup:native
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run release:check
      - run: npm run release:package
      - uses: actions/upload-artifact@v4
        with:
          name: player-two-source
          path: |
            release/*-source.zip
            release/SHA256SUMS
            release/dependency-licenses.json
